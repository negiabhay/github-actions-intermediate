name: Reusable Deploy Workflow

on: 
  workflow_call:
   inputs:
     environment:
      required: true
      type: string
     app_name:
       required: true
       type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Step 1 - Checkout Code
        uses: actions/checkout@v4

      - name: Step 2 - Run test
        run: echo "Running test for ${{ inputs.app_name }}"

      - name: Step 3 - Build the app
        run: echo "Building ${{ inputs.app_name }}"

      - name: Step 4 - Deploy to server
        run: echo "Deploying ${{ inputs.app_name }} to ${{ inputs.environment }} server..."
