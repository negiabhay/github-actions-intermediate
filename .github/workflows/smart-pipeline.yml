name: Smart pipeline V2

on: push

env:
  APP_NAME: quickbite-api
  NODE_ENV: production

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Step 1 - Download the code
        uses: actions/checkout@v4

      - name: Step 2 - Run test
        run: |
          echo "Running test for ${{ env.APP_NAME }} in ${{ env.NODE_ENV }} mode"
          echo "All test passed"

      - name: Notify if test failed
        if: failure()
        run: echo "Alert test failed! -- Notifying team"

  build:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    env:
      BUILD_VERSION: v1.0.0
    steps:
      - name: Step 1 - Bundle the App
        run: echo "Building ${{ env.APP_NAME }} version ${{ env.BUILD_VERSION }}"

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.actor == 'negiabhay'
    steps:
      - name: Step 1 - Deploy on server
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          echo "Deploying ${{ env.APP_NAME }}...."
          echo "Connecting to server with keys $SSH_KEY"
